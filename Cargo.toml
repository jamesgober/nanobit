[package]
name = "nanobit"
version = "0.3.0"
edition = "2021"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <code@jamesgober.dev>"
]

description = "Ultra-fast binary serialization with multi-format compression and zero-copy deserialization"
keywords = [
    "serialization", 
    "binary", 
    "compression", 
    "zero-copy", 
    "performance"
]
categories = [
    "encoding",
    "data-structures",
    "compression",
    "no-std",
    "database"
]
documentation = "https://docs.rs/nanobit"
repository = "https://github.com/jamesgober/nanobit"
homepage = "https://github.com/jamesgober/nanobit"



[features]
default = ["std", "serde", "compression", "multi-compression"]
# Standard library support: `to_writer`, `from_reader` and `std::error::Error`.
# Without it the crate builds for `no_std` targets with `alloc`.
std = ["serde/std"]
# LZ4 compression.
compression = ["std", "lz4_flex"]
# Zstandard and Snappy compression.
multi-compression = ["std", "zstd", "snap"]
# Kept so existing feature lists keep working. serde is always enabled now.
serde = []
serde_compat = ["serde"]



[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

# Optional compression support
lz4_flex = { version = "0.11", optional = true }

# Compression algorithms
zstd = { version = "0.13", optional = true }
snap = { version = "1.1", optional = true }


[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
zstd = "0.13"
snap = "1.1"


[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
